services:
  postgres:
    image: postgres:16-alpine
    container_name: qmt-quant-postgres
    environment:
      POSTGRES_USER: qmt
      POSTGRES_PASSWORD: qmt
      POSTGRES_DB: qmt_quant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmt -d qmt_quant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
