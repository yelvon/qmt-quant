[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmt-quant"
version = "0.1.0"
description = "QMT-based local quantitative platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
qmt = []
quant = [
    "vectorbt>=0.26",
    "polars>=1.0",
    "pyarrow>=15.0",
    "quantstats>=0.0.62",
    "nautilus_trader>=1.200; python_version>='3.12'",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
qmt-quant = "qmt_quant.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["qmt_quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
